version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: alumni_backend
    restart: always
    environment:
      - PORT=5000
      - JWT_SECRET=alumni_mitwpu_prod_secret_2026
    ports:
      - "5000:5000"
    networks:
      - alumni_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: alumni_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - alumni_network

networks:
  alumni_network:
    driver: bridge